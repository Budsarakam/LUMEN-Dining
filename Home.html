<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN Dining</title>
    
    <!-- Google Fonts: Playfair Display & Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; /* ล็อกห้ามเลื่อนทั้งหน้า Body */
            background-color: #ededed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2C2C2C;
        }

        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            height: 100dvh;
            background-color: #fffdec;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden; /* ล็อกห้ามเลื่อนสไลด์ขึ้น-ลง */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Hero Section (ยืดขยายตามพื้นที่ที่เหลืออัตโนมัติ) */
        .hero {
            position: relative;
            width: 100%;
            flex: 1; /* ยืดปรับขนาดพอดีกับหน้าจอ */
            min-height: 220px;
            background-color: #1a1a1a;
            background-image: url('LUMEN Dining.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Info Card */
        .info-card {
            position: relative;
            z-index: 20;
            width: 84%;
            margin-top: -30px; /* ดึงขึ้นไปเกยภาพเล็กน้อย */
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            padding: 10px 8px;
            border: 1.5px solid #3d2314;
            flex-shrink: 0;
        }

        .info-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 11px;
            color: #3d2314;
        }

        .info-col:first-child {
            border-right: 1px solid #3d2314;
        }

        .info-title {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            font-size: 11.5px;
            margin-bottom: 2px;
            color: #1a1a1a;
        }

        .info-value {
            font-weight: 500;
            color: #3d2314;
            font-size: 11.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
            font-size: 10.5px;
            color: #10B981;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10B981;
            border-radius: 50%;
        }

        /* Menu Buttons */
        .menu-container {
            width: 84%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .btn {
            position: relative;
            width: 100%;
            height: 44px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ปุ่ม 1: เข้าหน้าหลัก */
        .btn-primary {
            background-color: #d1bd9d;
            color: #2C2C2C;
            gap: 10px;
            font-weight: 600;
        }

        .btn-primary .icon-circle {
            width: 26px;
            height: 26px;
            background-color: #5c3826;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
        }

        .or-text {
            font-size: 11.5px;
            color: #5c6e58;
            font-style: italic;
        }

        /* ปุ่ม 2: ดูเมนูอาหาร */
        .btn-dark {
            background-color: #6a3e2b;
            color: white;
        }

        .btn-dark .content-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-dark .arrow {
            position: absolute;
            right: 18px;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 600;
        }

        /* ปุ่ม 3: จองโต๊ะออนไลน์ */
        .btn-light {
            background-color: #FFFFFF;
            border: 1.5px solid #3d2314;
            color: #2C2C2C;
        }

        .btn-light .content-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-light .arrow {
            position: absolute;
            right: 18px;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 600;
            color: #3d2314;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Hero Section -->
        <div class="hero"></div>

        <!-- Info Card -->
        <div class="info-card">
            <div class="info-col">
                <div class="info-title">🕒 เวลาเปิดทำการ</div>
                <div class="info-value">09:30 - 22:00</div>
                <div class="status-badge">
                    <div class="status-dot"></div> เปิด
                </div>
            </div>
            <div class="info-col">
                <div class="info-title">👤 ขณะนี้มีคิวรอทั้งหมด</div>
                <div class="info-value" style="margin-top: 4px;">-3 คิว-</div>
            </div>
        </div>

        <!-- Menu Buttons Container -->
        <div class="menu-container">
            <!-- 1. ปุ่มเข้าหน้าหลัก -->
            <a href="Homepage.html" class="btn btn-primary">
                <div class="icon-circle">🏠</div>
                <span>เข้าหน้าหลัก</span>
            </a>

            <div class="or-text">or</div>

            <!-- 2. ปุ่มดูเมนูอาหาร -->
            <a href="เมนูอาหารทั้งหมด.html" class="btn btn-dark">
                <div class="content-group">
                    <span style="font-size: 17px;">🍴</span>
                    <span>ดูเมนูอาหาร</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>

            <div class="or-text">or</div>

            <!-- 3. ปุ่มจองโต๊ะออนไลน์ -->
            <a href="จองคิวออนไลน์อัตโนมัติ.html" class="btn btn-light">
                <div class="content-group">
                    <span style="font-size: 17px;">📅</span>
                    <span style="font-weight: 600;">จองโต๊ะออนไลน์</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>
        </div>
    </div>

</body>
</html>
